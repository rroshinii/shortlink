spring.application.name=shortlink
spring.datasource.url=jdbc:mysql://localhost:3306/shortlink_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=change_me
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Used to build the short URL returned to the client
app.base-url=http://localhost:8080
app.cleanup.retention-days=0
app.cleanup.cron=0 * * * * *
